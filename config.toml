# 청약·정비사업 트래커 설정
# 값을 바꾼 뒤 커밋하면 다음 실행부터 반영됩니다.

[general]
# 청약홈 SUBSCRPT_AREA_CODE_NM 표기 (짧은 시·도명)
regions = ["서울", "경기"]
# 이미 끝난 일정도 며칠간 보여줄지 (당첨자 발표·계약 확인용)
keep_past_days = 14
# 모집공고일 기준으로 며칠 전 공고까지 API에서 가져올지
lookback_days = 120

[applyhome]
base_url = "https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1"
per_page = 500
max_pages = 20
# 수집할 공고 유형: apt(일반/공공분양·신혼희망타운), remndr(무순위·잔여세대), opt(임의공급)
sources = ["apt", "remndr", "opt"]
# 주택형별 분양가(최저~최고) 조회. 공고당 API 1회 추가 호출, 결과는 캐시됨
fetch_prices = true
# 1순위 접수가 끝난 공고의 경쟁률·당첨가점 (data.go.kr 15098905, 같은 키로 활용신청)
fetch_competition = true

[market]
# 국토부 아파트 매매 실거래가 (data.go.kr 15126469, 같은 키로 활용신청)
fetch_trades = true
# 토지임대부: 월 토지임대료(만원)를 연 수익률로 나눈 '땅값 상당액'을 실질 비용에 더해 비교
land_lease_yield = 0.04

[market.land_lease]
# 공고명 일부 = { 면적대 = 월 임대료(만원) }  — 고덕강일3단지: SBS Biz 2026-10-16 보도
"고덕강일지구 3단지" = { "49" = 42.6, "59" = 51.15 }

[news]
enabled = true

[geo]
# 지도 좌표: KAKAO_REST_KEY(추천, 번지 단위) 또는 VWORLD_KEY 가 .env 에 있으면 그것을,
# 없으면 OpenStreetMap(동 중심 + 이름이 일치하는 아파트 단지)을 씁니다.
# 한 번 찾은 좌표는 data/state/geocode.json 에 남아 다음부터는 바로 씁니다.
max_new_per_run = 300  # 무료 OSM 조회 수 상한(실행당). 다 못 찾은 곳은 다음 실행 때 이어서 찾음
nominatim_delay = 1.1
max_seconds = 240      # 좌표 찾기에 쓰는 최대 시간(초). 넘으면 다음 갱신 때 이어서

[seoul_pipeline]
# 서울 열린데이터광장 '서울시 정비사업 추진현황' (분기 갱신, 엑셀)
enabled = true
dataset_page = "https://data.seoul.go.kr/dataList/OA-22856/F/1/datasetView.do"
download_url = "https://datafile.seoul.go.kr/bigfile/iot/inf/nio_download.do?&useCache=false"
inf_id = "OA-22856"
# 자동 다운로드가 실패하면 data/raw/seoul/ 에 넣어 둔 최신 xlsx를 사용

[pipeline]
# 웹에서 기본으로 보여줄 최소 단계 (구역지정 < 추진위 < 조합설립 < 건축심의 < 사업시행 < 관리처분 < 착공)
default_min_stage = "사업시행"
