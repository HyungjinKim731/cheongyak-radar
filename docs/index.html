<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청약·정비 레이더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e6b5b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17211e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청약레이더">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 열짜리 작업 화면. 상단 고정 헤더+탭, 필터 칩 줄, 그 아래 카드 목록. 날짜와 D-day가 주인공. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --fg: #15201d; --muted: #5d6b67; --line: #d9e1de;
  --accent: #0e6b5b; --accent-soft: #dcefea; --hot: #b4361f; --hot-soft: #f8e3dd;
  --warn: #8a5a00; --warn-soft: #f6ecd2; --past: #a3aeaa;
  --plan: #5b4a9e; --plan-soft: #e9e5f6;
  --f-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1614; --surface: #17211e; --fg: #e4ece9; --muted: #95a5a0; --line: #2a3733;
  --accent: #4fc2a9; --accent-soft: #173a33; --hot: #f08a70; --hot-soft: #3d221b;
  --warn: #e3b75a; --warn-soft: #3a2f17; --past: #5c6b67; --plan: #b3a5ea; --plan-soft: #2a2545; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #17211e; --fg: #e4ece9; --muted: #95a5a0; --line: #2a3733;
  --accent: #4fc2a9; --accent-soft: #173a33; --hot: #f08a70; --hot-soft: #3d221b;
  --warn: #e3b75a; --warn-soft: #3a2f17; --past: #5c6b67; --plan: #b3a5ea; --plan-soft: #2a2545; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--surface); border-bottom: 1px solid var(--line) }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 6px; flex-wrap: wrap }
h1 { font: 800 1.35rem/1.2 var(--f-display); margin: 0; letter-spacing: -0.01em }
h1 span { color: var(--accent) }
.stamp { font: 500 .78rem var(--f-mono); color: var(--muted) }
nav { display: flex; gap: 4px; overflow-x: auto }
nav a { padding: 8px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap }
nav a[aria-current="page"] { color: var(--fg); border-color: var(--accent) }
nav a small { font: 500 .72rem var(--f-mono); margin-left: 4px; color: var(--muted) }

.banner { margin-top: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: .88rem }
.banner ul { margin: 4px 0 0; padding-left: 18px }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 14px 4px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.sep { width: 1px; height: 20px; background: var(--line) }
input[type="search"], select { font: inherit; font-size: .88rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); min-width: 0 }
input[type="search"] { flex: 1 1 160px }

main { padding-block: 6px 48px }
.group-h { font: 700 .8rem var(--f-body); color: var(--muted); letter-spacing: .04em; margin: 22px 0 8px; display: flex; justify-content: space-between }
.list { display: grid; gap: 10px }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: grid; gap: 8px; min-width: 0 }
.row1 { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between }
.name { font-weight: 600; font-size: 1.02rem; line-height: 1.35; min-width: 0; overflow-wrap: anywhere }
.meta { color: var(--muted); font-size: .84rem; display: flex; flex-wrap: wrap; gap: 4px 10px }
.meta b { color: var(--fg); font-weight: 600 }
.dday { flex: none; font: 500 .8rem var(--f-mono); padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); text-align: right; font-variant-numeric: tabular-nums }
.dday.hot { background: var(--hot-soft); color: var(--hot) }
.dday.done { background: transparent; color: var(--past); border: 1px solid var(--line) }
.star { flex: none; border: 0; background: none; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 2px 2px; color: var(--past) }
.star[aria-pressed="true"] { color: var(--warn) }

.tl { display: flex; flex-wrap: wrap; gap: 6px }
.ev { font-size: .8rem; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; display: inline-flex; gap: 6px; font-variant-numeric: tabular-nums }
.ev time { font-family: var(--f-mono); font-size: .76rem }
.ev.past { color: var(--past); border-style: dashed }
.ev.next { border-color: var(--accent); color: var(--accent); font-weight: 600 }
.links { display: flex; gap: 14px; font-size: .84rem }

/* 정비사업 단계 막대 */
.ladder { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; margin-top: 14px }
.ladder button { border: 0; background: var(--surface); border-top: 3px solid var(--line); padding: 6px 2px 4px; cursor: pointer; display: grid; gap: 1px; text-align: center; min-width: 0 }
.ladder button.on { border-top-color: var(--accent); background: var(--accent-soft) }
.ladder b { font: 500 .95rem var(--f-mono); font-variant-numeric: tabular-nums }
.ladder span { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stage { flex: none; font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent) }
.stage.s7, .stage.s8 { background: var(--hot-soft); color: var(--hot) }
.steps { display: flex; gap: 2px }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: var(--line) }
.steps i.on { background: var(--accent) }
.memo { font-size: .84rem; background: var(--bg); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere }
.more { justify-self: center; margin-top: 8px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer }
.empty { color: var(--muted); padding: 28px 0; text-align: center }

.chg { display: grid; grid-template-columns: 84px 1fr; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line) }
.chg time { font: 500 .76rem var(--f-mono); color: var(--muted); padding-top: 2px }
.chg .k { font-size: .72rem; font-weight: 600; color: var(--accent) }
.chg .d { grid-column: 2; color: var(--muted); font-size: .84rem }
footer { color: var(--muted); font-size: .78rem; padding-block: 0 32px }
@media (max-width: 480px) { .ladder span { font-size: .6rem } .chg { grid-template-columns: 64px 1fr } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s } .card:hover { border-color: var(--accent) } }
.more-box { border-top: 1px dashed var(--line); padding-top: 6px; display: grid; gap: 4px }
details.x > summary { cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--accent); list-style: none; padding: 4px 0 }
details.x > summary::-webkit-details-marker { display: none }
details.x > summary::before { content: "▸ "; } details.x[open] > summary::before { content: "▾ "; }
.cond { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: .86rem; padding: 6px 0 }
.cond dt { font-weight: 600; color: var(--muted) } .cond dd { margin: 0; min-width: 0 }
.cond dd.warn { color: var(--hot) }
.tbl-wrap { overflow-x: auto; margin: 6px 0 }
.sched-bar { align-items: center }
.sched-bar select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 8px; font-size: .85rem; max-width: 100% }
.seg { display: inline-flex; gap: 4px }
.rsline { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 6px 0 2px }
.rs { font-size: .76rem; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--muted); background: var(--bg) }
.rs b { color: var(--ink) }
.rs.w { border-color: var(--warn, #c77700); }
.rs.w b { color: var(--warn, #c77700) }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 4px 0 }
.inv div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0 }
.inv small { display: block; color: var(--muted); font-size: .72rem }
.inv b { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.bands { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 8px 0 2px }
.band { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: .8rem; min-width: 0; background: var(--bg) }
.band b { font-size: .9rem }
.band .bp { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.ptable-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table.pt { border-collapse: separate; border-spacing: 0; font-size: .82rem; width: 100%; min-width: 760px }
table.pt th, table.pt td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; white-space: nowrap; vertical-align: middle }
table.pt th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 600; z-index: 1 }
table.pt th button { all: unset; cursor: pointer; display: inline-flex; gap: 3px; align-items: center }
table.pt th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
table.pt th[aria-sort] { color: var(--ink) }
table.pt td.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums }
table.pt th.num { text-align: right }
table.pt td:first-child, table.pt th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 128px; max-width: 168px; white-space: normal; box-shadow: 1px 0 0 var(--line) }
table.pt th:first-child { background: var(--bg); z-index: 3 }
table.pt tr.grp td { border-top: 2px solid var(--line) }
table.pt .sub { color: var(--muted); font-size: .74rem; display: block }
table.t { border-collapse: collapse; font-size: .82rem; width: 100%; min-width: 420px }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
table.t th { font-weight: 600; color: var(--muted); background: var(--bg) }
table.t td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .78rem; white-space: nowrap }
.agree { font-size: .72rem; font-weight: 600; padding: 1px 6px; border-radius: 5px; white-space: nowrap }
.agree.ok { background: var(--accent-soft); color: var(--accent) }
.agree.mid { background: var(--warn-soft); color: var(--warn) }
.agree.bad { background: var(--hot-soft); color: var(--hot) }
.statline { font: 500 .76rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.news li { font-size: .84rem; margin: 3px 0 } .news { margin: 4px 0; padding-left: 18px }
.rank { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start }
.rank .no { font: 800 1.4rem/1 var(--f-display); color: var(--accent); text-align: center; padding-top: 2px }
.score { font: 500 .86rem var(--f-mono); padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap }
.score.neg { background: var(--hot-soft); color: var(--hot) }
.bar { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden }
.bar i { position: absolute; top: 0; bottom: 0; background: var(--accent) }
.bar i.neg { background: var(--hot) }
.prose { max-width: 68ch; font-size: .92rem } .prose h2 { font: 700 1.05rem var(--f-display); margin: 26px 0 8px }
.prose ol { padding-left: 20px } .prose li { margin: 6px 0 }
.src { font-size: .78rem; color: var(--muted) } .src a { color: var(--muted) }
.method { font-size: .84rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-top: 12px }
/* 모바일 보정: 펼친 표가 카드·페이지를 넓히지 않게, 탭 대상은 손가락 크기로 */
.list, .more-box, .card { grid-template-columns: minmax(0, 1fr) }
.rank { grid-template-columns: 34px minmax(0, 1fr) }
details.x, .more-box > *, .card > * { min-width: 0 }
.row1 > .name { flex: 1 1 auto }
.side { display: flex; gap: 2px; align-items: flex-start; flex: none }
.star { min-width: 40px; min-height: 40px; margin: -8px -8px -8px 0; font-size: 1.25rem }
details.x > summary { padding: 8px 0; min-height: 40px; display: flex; align-items: center }
details > summary.meta { padding: 8px 0; min-height: 36px }
.tbl-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain }
table.t td a { overflow-wrap: anywhere }
nav { scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent) }
nav::-webkit-scrollbar { display: none }
nav a { min-height: 44px; display: inline-flex; align-items: center }
@media (max-width: 480px) {
  body { font-size: 14.5px }
  h1 { font-size: 1.2rem }
  nav a { padding: 8px 9px 10px; font-size: .92rem }
  .dday { font-size: .74rem; padding: 3px 6px }
  table.t { min-width: 360px; font-size: .78rem }
  .cond { grid-template-columns: 82px minmax(0, 1fr) }
  .rank { grid-template-columns: 24px minmax(0, 1fr); gap: 6px }
  .rank .no { font-size: 1.15rem }
  .filters { gap: 6px }
  .chip { padding: 7px 12px }
}
/* 내 자격 · 예정 · 지도 · 새로고침 */
.agree.later { background: var(--plan-soft); color: var(--plan) }
.elig { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: .84rem; min-width: 0 }
.elig .meta { display: inline; overflow-wrap: anywhere }
.res { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line) }
.res:last-child { border-bottom: 0 }
.res .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; font-size: .9rem }
.res ul { margin: 2px 0 0; padding-left: 18px; font-size: .82rem; color: var(--muted) }
.refresh { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .8rem; cursor: pointer; min-height: 36px; white-space: nowrap }
.refresh[aria-busy="true"] { color: var(--accent); border-color: var(--accent) }
.refresh[aria-busy="true"]::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .refresh[aria-busy="true"]::before { animation: none } }
.head-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .86rem; z-index: 20; max-width: calc(100% - 32px) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0 }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px }
.kpi b { display: block; font: 700 1.4rem/1.1 var(--f-display); font-variant-numeric: tabular-nums }
.kpi span { font-size: .78rem; color: var(--muted) }
.kpi.ok b { color: var(--accent) } .kpi.mid b { color: var(--warn) } .kpi.later b { color: var(--plan) }
.form { display: grid; gap: 4px }
.form fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 12px; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 12px; min-width: 0 }
.form legend { font-weight: 700; font-size: .86rem; padding: 0 4px }
.fld { display: grid; gap: 3px; font-size: .82rem; color: var(--muted); min-width: 0 }
.fld input:not([type="checkbox"]), .fld select { font: inherit; font-size: .95rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0 }
.fld.chk { grid-template-columns: auto 1fr; align-items: center; gap: 8px; min-height: 40px }
.fld.chk input { width: 20px; height: 20px; accent-color: var(--accent) }
.fld.unk input { border-style: dashed; border-color: var(--warn) }
.btns { display: flex; gap: 8px; flex-wrap: wrap }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 40px }
.btn.ghost { background: var(--surface); color: var(--accent) }
.ttree { width: 100%; border-collapse: collapse; font-size: .84rem; min-width: 520px }
.ttree th, .ttree td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top }
.ttree th { background: var(--bg); color: var(--muted); font-weight: 600 }
.ttree tr.grp td { background: var(--bg); font-weight: 700; color: var(--fg) }
.ttree td.why { color: var(--muted); font-size: .8rem }
.up-card .row1 .name { font-size: .98rem }
.off { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--accent); color: var(--surface); vertical-align: 1px; margin-right: 3px }
.unoff { display: inline-block; font-size: .7rem; font-weight: 600; padding: 1px 6px; border-radius: 5px; border: 1px dashed var(--muted); color: var(--muted); vertical-align: 1px }
.badge-plan { background: var(--plan-soft); color: var(--plan); font-size: .76rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap }
#map { position: relative; z-index: 0; isolation: isolate; height: min(70vh, 640px); min-height: 360px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg) }
.leaflet-container { font: inherit }
.leaflet-popup-content { font-size: .84rem; line-height: 1.45; margin: 10px 12px }
.leaflet-popup-content b { font-size: .92rem }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter: brightness(.72) contrast(1.08) saturate(.85) } }
:root[data-theme="dark"] .leaflet-tile-pane { filter: brightness(.72) contrast(1.08) saturate(.85) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px }
img { max-width: 100% }
[hidden] { display: none !important }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head">
      <h1>청약·정비 <span>레이더</span></h1>
      <div class="head-r"><div class="stamp" id="stamp">불러오는 중…</div>
        <button type="button" class="refresh" id="refresh" hidden>↻ 최신 정보</button>
        <a class="refresh" id="pf-link" href="portfolio/" hidden style="text-decoration:none;color:inherit">포트폴리오</a></div>
    </div>
    <div id="focus-bar" class="filters" style="padding:4px 0 0"></div>

<script src="app/elig.js"></script>
<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // 오늘(KST)
  const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const TODAY = kstToday();
  const dayDiff = (iso) => Math.round((Date.parse(iso) - Date.parse(TODAY)) / 86400e3);
  const md = (iso) => iso ? `${+iso.slice(5, 7)}.${+iso.slice(8, 10)}` : "";
  const wd = (iso) => "일월화수목금토"[new Date(iso + "T00:00:00").getDay()];
  const eok = (man) => man == null ? null : (man >= 10000 ? (Math.round(man / 1000) / 10) + "억" : man.toLocaleString() + "만");
  const priceTxt = (s) => s.price_min == null ? "" : (s.price_min === s.price_max ? eok(s.price_min) : `${eok(s.price_min)}~${eok(s.price_max)}`);

  let D = null;
  const favs = new Set(store.get("favs", []));
  const saveFavs = () => store.set("favs", [...favs]);
  const st = Object.assign({ regions: null, kinds: ["apt", "remndr", "opt"], favOnly: false,
                             pRegions: null, pTypes: null, minStage: null, watchOnly: false, q: "", sort: "stage", limit: 60,
                             sView: "card", sSort: "date", tSort: { key: "date", dir: 1 }, tBand: "all" },
                           store.get("filters", {}));
  const saveSt = () => { const { q, limit, ...rest } = st; store.set("filters", rest); };

  function chip(label, pressed, onClick) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.addEventListener("click", onClick);
    return b;
  }
  function starBtn(id, label) {
    const on = favs.has(id);
    return `<button class="star" type="button" data-fav="${esc(id)}" aria-pressed="${on}" aria-label="${esc(label)} 관심 표시">${on ? "★" : "☆"}</button>`;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-fav]");
    if (!b) return;
    const id = b.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveFavs(); render();
  });

  // ---------------------------------------------------------------- 보는 범위 (핵심지역 · 주변 시세 하한)
  const FOCUS = () => D.focus || { core_only: true, min_expected_eok: 10, definition: "" };
  const coreOk = (x) => !st.coreOnly || x.core !== false;
  const priceOk = (s) => { const m = s.market || {}; return !st.minEok || !(m.method === "distance" && m.expected && m.expected < st.minEok * 1e4); };
  const focusOk = (s) => coreOk(s) && priceOk(s);
  function focusTag(s) {
    if (!st.minEok) return "";
    const m = s.market || {};
    return m.method === "distance" ? "" : `<span class="unoff" title="실거래 거리 기반 시세가 없어 ${st.minEok}억 기준을 적용하지 못했습니다">시세 근거 없음</span>`;
  }
  function renderFocusBar() {
    const f = FOCUS();
    if (st.coreOnly == null) st.coreOnly = f.core_only;
    if (st.minEok == null) st.minEok = f.min_expected_eok;
    const box = $("#focus-bar"); box.innerHTML = "";
    box.append(chip("🎯 핵심지역만", st.coreOnly, () => { st.coreOnly = !st.coreOnly; saveSt(); render(); }));
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "주변 시세 하한");
    sel.style.cssText = "border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font-size:.85rem";
    [[0, "주변 시세 전체"], [10, "주변 시세 10억↑"], [15, "15억↑"], [20, "20억↑"]].forEach(([v, l]) => {
      const o = document.createElement("option"); o.value = v; o.textContent = l; if (+st.minEok === v) o.selected = true; sel.append(o);
    });
    sel.addEventListener("change", () => { st.minEok = +sel.value; saveSt(); render(); });
    box.append(sel);
    const hid = D.schedules.filter((s) => nextEvent(s) && st.regions && st.regions.includes(s.region) && !focusOk(s)).length;
    const info = document.createElement("span"); info.className = "meta";
    info.innerHTML = `${hid ? `진행 중 공고 ${hid}건 숨김 · ` : ""}<a href="${esc(f.source || "#")}" target="_blank" rel="noopener" title="${esc(f.definition || "")}">핵심지역 기준</a>`;
    box.append(info);
  }

  // ---------------------------------------------------------------- 청약 일정
  const KIND = { apt: "APT", remndr: "무순위·잔여", opt: "임의공급" };
  function nextEvent(s) {
    return s.events.find((e) => e.end >= TODAY) || null;
  }
  function renderSchedFilters() {
    const box = $("#f-sched"); box.innerHTML = "";
    const regs = D.regions;
    if (!st.regions) st.regions = [...regs];
    regs.forEach((r) => box.append(chip(r, st.regions.includes(r), () => {
      st.regions = st.regions.includes(r) ? st.regions.filter((x) => x !== r) : [...st.regions, r];
      saveSt(); render();
    })));
    box.append(Object.assign(document.createElement("span"), { className: "sep" }));
    Object.entries(KIND).forEach(([k, label]) => box.append(chip(label, st.kinds.includes(k), () => {
      st.kinds = st.kinds.includes(k) ? st.kinds.filter((x) => x !== k) : [...st.kinds, k];
      saveSt(); render();
    })));
    box.append(Object.assign(document.createElement("span"), { className: "sep" }));
    box.append(chip("★ 관심만", st.favOnly, () => { st.favOnly = !st.favOnly; saveSt(); render(); }));
    box.append(chip("✓ 내 자격 되는 것", st.eligOnly, () => { st.eligOnly = !st.eligOnly; saveSt(); render(); }));
  }
  // ---------------------------------------------------------------- 내 정보(프로필)·자격
  const BLANK = { name: "", birth: "", marital: "single", marriage_date: "", household_head: true, household_size: 1, with_parents: false,
    homes_owned: 0, officetel: 0, ever_owned_home: false, won_5y: false, special_won: false, sido: "서울", sigungu: "", residence_since: "",
    acct_years: null, acct_payments: null, acct_balance: null, income_self: null, income_includes_bonus: false, spouse_income: null, tax_years: null,
    realestate: 0, lease_deposit: 0, financial_assets: null, car: null, debts: null, parent_assets: null, children: 0, newborn: 0, parent65_years: 0,
    spouse_homeless: true, spouse_ever_owned: false, spouse_acct_years: null, spouse_realestate: 0 };
  let PROF = { ...BLANK }, PROF_SRC = "빈 기본값", SERVER_PROFILE = null;
  async function loadProfile() {
    if (window.__PROFILE__) SERVER_PROFILE = window.__PROFILE__;
    else {
      try { const r = await fetch("profile.json", { cache: "no-store" }); if (r.ok) SERVER_PROFILE = await r.json(); } catch (e) {}
    }
    const saved = store.get("profile", null);
    if (saved) { PROF = { ...BLANK, ...saved }; PROF_SRC = "이 기기에 저장한 값"; }
    else if (SERVER_PROFILE) { PROF = { ...BLANK, ...SERVER_PROFILE }; PROF_SRC = "PC의 profile.local.json"; }
    else { PROF = { ...BLANK }; PROF_SRC = "빈 기본값 — 내 자격 탭에서 입력하세요"; }
  }
  const EP = () => (D.guide && D.guide.elig) || null;
  let ELC = new Map();
  function elig(s) {
    if (!window.Elig || !EP()) return null;
    if (!ELC.has(s.id)) { try { ELC.set(s.id, window.Elig.forNotice(PROF, s, EP(), TODAY)); } catch (e) { ELC.set(s.id, null); } }
    return ELC.get(s.id);
  }
  const ST_CLS = { ok: "ok", maybe: "mid", later: "later", no: "bad" };
  const ST_TXT = { ok: "넣을 수 있음", maybe: "확인 필요", later: "나중에 가능", no: "자격 없음" };
  function eligLine(s) {
    const e = elig(s); if (!e) return "";
    return `<div class="elig"><span class="agree ${ST_CLS[e.best]}">내 자격 · ${ST_TXT[e.best]}</span> <span class="meta">${esc(e.label)}</span></div>`;
  }
  function resultsHtml(rs) {
    return rs.map((r) => `<div class="res"><div class="h"><span class="agree ${ST_CLS[r.status]}">${ST_TXT[r.status]}</span>${esc(r.label)}${r.route ? ` <span class="meta">${esc(r.route)}</span>` : ""}</div>
      <ul>${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
  }
  function eligDetail(s) {
    const e = elig(s); if (!e) return "";
    return `<details class="x"><summary>내 자격 자세히</summary>${resultsHtml(e.results)}
      <p class="src">내 정보는 <a href="#me">내 자격</a> 탭에서 바꿀 수 있습니다. 최종 기준은 입주자모집공고문.</p></details>`;
  }
  const eligOk = (s) => { const e = elig(s); return !e || e.best === "ok" || e.best === "maybe"; };

  // ---------------------------------------------------------------- 공통: 통계량·출처
  const AG = { "일치": "ok", "대체로 일치": "mid", "불일치": "bad", "단일 출처": "mid" };
  const num = (v, unit) => v == null ? "-" : (unit === "만원" ? won(v) : (+v).toLocaleString(undefined, { maximumFractionDigits: 2 }));
  function statLine(st, unit, vals) {
    if (!st || !st.n) return "";
    if (st.n === 1 && vals && vals[0] && vals[0].official) return `<span class="off">공식</span> <span class="statline">${num(st.min, unit)}${unit === "만원" ? "" : esc(unit)}</span>`;
    const u = unit === "만원" ? "" : unit;
    const parts = [`출처 ${st.n}곳`];
    if (st.n_numeric > 1) parts.push(`중앙값 ${num(st.median, unit)}${u}`, `평균 ${num(st.mean, unit)}`, `범위 ${num(st.min, unit)}~${num(st.max, unit)}`, `편차 ${st.spread_pct}%`);
    else if (st.n_numeric === 1) parts.push(`값 ${num(st.min, unit)}${u}`);
    return `<span class="agree ${AG[st.agreement] || "mid"}">${esc(st.agreement)}</span> <span class="statline">${parts.join(" · ")}</span>`;
  }
  function valuesTable(values, unit) {
    return `<div class="tbl-wrap"><table class="t"><thead><tr><th>출처</th><th>값</th><th>날짜</th><th>메모</th></tr></thead><tbody>${
      values.map((v) => `<tr><td>${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.source)}</a>` : esc(v.source)}</td>
        <td class="num">${num(v.value, unit)}${unit === "만원" ? "" : esc(unit)}</td><td>${esc(v.date || "")}</td><td>${esc(v.note || v.kind || "")}</td></tr>`).join("")
    }</tbody></table></div>`;
  }
  const FACT = () => Object.fromEntries(((D.guide || {}).facts || []).map((f) => [f.key, f]));
  function factBadges(keys) {
    const F = FACT();
    return (keys || []).filter((k) => F[k]).map((k) => {
      const st = F[k].stats;
      const v0 = F[k].values[0] || {};
      return `<a class="off" href="${esc(v0.url)}" target="_blank" rel="noopener" title="${esc(v0.source)}${v0.note ? " · " + esc(v0.note) : ""}">공식 근거</a>`;
    }).join(" ");
  }
  const won = (man) => man == null ? "-" : (Math.abs(man) >= 10000 ? (man / 10000).toFixed(2).replace(/\.?0+$/, "") + "억" : Math.round(man).toLocaleString() + "만");
  const pct = (v) => v == null ? "-" : `${v > 0 ? "+" : ""}${v}%`;

  function marketBlock(m) {
    if (!m || (!m.expected && !m.newsale_margin_pct && !m.region_trend && !(m.nearby && m.nearby.reason))) return `<p class="meta">비교할 시세 데이터가 아직 없습니다. data/comps.csv 에 주변 단지를 추가하거나 실거래가 API를 연결하세요.</p>`;
    let h = "";
    const nb = m.nearby;
    if (m.method === "distance") {
      h += `<p class="meta" style="margin:4px 0"><span class="off">실측 근거</span> 국토교통부 실거래가(해제·직거래 제외)로, 공고 위치에서 실제 거리 ${nb.radius_km}km 안의 10년 이내 단지만 비교했습니다. 단지별 전용㎡당 중앙값 × 이 공고 주택형 면적.</p>`;
    } else {
      h += `<p class="meta" style="margin:4px 0"><span class="unoff">참고용</span> ${esc((nb && nb.reason) || "거리 기반 비교 불가")} — 아래 값은 같은 동·시군구 거래로 낸 참고치이고, <b>추천 순위에는 넣지 않았습니다.</b></p>`;
    }
    if (nb && nb.complexes && nb.complexes.length) {
      h += `<div class="ptable-wrap" style="margin:6px 0"><table class="pt" style="min-width:560px"><thead><tr><th>비교 단지</th><th class="num">준공</th><th class="num">거리</th><th class="num">거래</th><th class="num">${esc(m.band || "")}㎡ 환산</th><th class="num">거래가 범위</th><th>최근 거래</th></tr></thead><tbody>${
        nb.complexes.map((c) => `<tr><td><b>${esc(c.apt)}</b><span class="sub">${esc(c.dong || "")} ${esc(c.jibun || "")}</span></td><td class="num">${c.build_year || "-"}</td><td class="num">${c.km}km</td><td class="num">${c.n}건</td><td class="num">${won(c.value)}</td><td class="num">${won(c.min)}~${won(c.max)}</td><td>${esc(c.last)}</td></tr>`).join("")
      }</tbody></table></div><p class="meta">각 단지 거래는 <a class="off" href="https://rt.molit.go.kr/" target="_blank" rel="noopener">국토부 실거래가 공개시스템</a>에서 직접 확인할 수 있습니다.${nb.unlocated ? ` 위치를 번지까지 못 찾은 단지 ${nb.unlocated}곳은 거리 계산에서 뺐습니다.` : ""}</p>`;
    }
    h += `<dl class="cond">`;
    h += `<dt>분양가(${esc(m.band || "")}㎡)</dt><dd>${won(m.price_rep)}${m.land_equiv ? ` + 토지임대료 환산 ${won(m.land_equiv)} = 실질 ${won(m.price_effective)}` : ""}</dd>`;
    if (m.expected) h += `<dt>${m.method === "distance" ? "기대 시세" : "참고 시세"}</dt><dd><b>${won(m.expected)}</b>${nb && nb.ok !== false && nb.low ? ` <span class="meta">(단지별 ${won(nb.low)}~${won(nb.high)})</span>` : ""} <span class="meta">(${esc(m.expected_basis)})</span></dd><dt>시세 여유율</dt><dd><b>${pct(m.margin_pct)}</b></dd>`;
    if (m.newsale_margin_pct != null) h += `<dt>인근 분양가 대비</dt><dd>${pct(m.newsale_margin_pct)} <span class="meta">(+면 이 단지가 더 쌈)</span></dd>`;
    if (m.momentum_3m_pct != null) h += `<dt>최근 3개월</dt><dd>${pct(m.momentum_3m_pct)} <span class="meta">(${esc(m.momentum_basis)})</span></dd>`;

  function extrasBlock(s) {

  // ---------------------------------------------------------------- 당첨 후 제한 (전매·실거주·재당첨)
  const yTxt = (y) => !y ? "없음" : (y < 1 ? `${Math.round(y * 12)}개월` : `${+y.toFixed(1)}년`);
  const resideTxt = (r) => !r.reside_max ? "없음" : (r.reside_min === r.reside_max ? yTxt(r.reside_max) : `${yTxt(r.reside_min)}~${yTxt(r.reside_max)}`);
  function restrictLine(s) {

  }
  const lockOf = (s) => (s.invest || {}).lock_years;

  // ---------------------------------------------------------------- 평형별 가격
  const PY = (b, k) => b && b.pyeong ? b.pyeong : Math.round((+k) * 1.33 / 3.3058);   // 공급면적 없으면 추정
  const bandList = (s) => Object.entries(s.bands || {}).map(([k, b]) => ({ k: +k, ...b, py: PY(b, k) })).sort((a, b) => a.k - b.k);
  const BAND_GROUPS = [["all", "전체 평형"], ["small", "~59㎡ (~25평)"], ["mid", "74~84㎡ (국평)"], ["large", "100㎡+ (대형)"]];
  const inBand = (k, g) => g === "all" || (g === "small" ? k <= 59 : g === "mid" ? (k >= 74 && k <= 84) : k >= 100);
  const bandPrice = (b) => b.min == null ? "-" : (b.min === b.max ? eok(b.min) : `${eok(b.min)}~${eok(b.max)}`);
  function bandsBlock(s) {
    const bl = bandList(s); if (!bl.length) return "";
    return `<div class="bands" aria-label="평형별 분양가">${bl.map((b) => `<div class="band">

      <div class="bp">${bandPrice(b)}</div>
      <div class="meta">${b.pyeong_price ? `3.3㎡당 ${b.pyeong_price.toLocaleString()}만` : ""}${b.units ? ` · ${b.units}세대` : ""}</div></div>`).join("")}</div>`;
  }
  const midPrice = (s) => { const bl = bandList(s).filter((b) => b.median != null); return bl.length ? bl.map((b) => b.median) : (s.price_min != null ? [s.price_min] : []); };
  const ELIG_ORDER = { ok: 0, maybe: 1, later: 2, no: 3 };
  const SCHED_SORT = {
    date: null,
    price_asc: (a, b) => nz(Math.min(...midPrice(a)), 1) - nz(Math.min(...midPrice(b)), 1),
    price_desc: (a, b) => nz(Math.max(...midPrice(b)), -1) - nz(Math.max(...midPrice(a)), -1),
    pp_asc: (a, b) => nz(a.pyeong_price, 1) - nz(b.pyeong_price, 1),
    margin: (a, b) => nz((b.market || {}).margin_pct, -1) - nz((a.market || {}).margin_pct, -1),
    score: (a, b) => nz((b.invest || {}).score, -1) - nz((a.invest || {}).score, -1),
    elig: (a, b) => nz(ELIG_ORDER[(elig(a) || {}).best], 1) - nz(ELIG_ORDER[(elig(b) || {}).best], 1),
  };
  function nz(v, dir) { return v == null || !isFinite(v) ? (dir > 0 ? 1e12 : -1e12) : v; }

  // 표 보기: 공고 × 평형 한 줄씩
  const TCOLS = [
    ["name", "단지", (r) => r.s.name],
    ["area", "전용㎡", (r) => r.b ? r.b.k : null, true],
    ["py", "평형", (r) => r.b ? r.b.py : null, true],
    ["price", "분양가", (r) => r.b ? r.b.median : r.s.price_min, true],
    ["pp", "3.3㎡당", (r) => r.b ? r.b.pyeong_price : r.s.pyeong_price, true],
    ["units", "세대", (r) => r.b ? r.b.units : r.s.units, true],
    ["date", "다음 일정", (r) => { const n = nextEvent(r.s); return n ? n.start : "9999"; }],
    ["lock", "묶임(전매·실거주)", (r) => lockOf(r.s), true],
    ["margin", "시세 여유", (r) => (r.s.market || {}).margin_pct, true],
    ["score", "투자 점수", (r) => (r.s.invest || {}).score, true],
    ["elig", "내 자격", (r) => ELIG_ORDER[(elig(r.s) || {}).best]],

  function priceTable(rows) {
    const out = [];
    rows.forEach((s) => {

      if (bl.length) bl.forEach((b, i) => out.push({ s, b, first: i === 0 }));

    };
    return `<p class="meta" style="margin:4px 2px 8px">열 제목을 누르면 그 기준으로 정렬됩니다(한 번 더 누르면 반대로). 평형 = 공급면적 기준, '시세 여유·투자 점수'는 단지 대표 평형 기준. 묶임 = 전매제한·실거주의무로 팔 수 없는 기간(추정).</p>
      <div class="ptable-wrap"><table class="pt"><thead><tr>${th}</tr></thead><tbody>${out.map(td).join("") || `<tr><td colspan="11">해당 평형이 없습니다.</td></tr>`}</tbody></table></div>`;

  document.addEventListener("click", (e) => {

    const v = e.target.closest("[data-sview]");
    if (v) { st.sView = v.dataset.sview; saveSt(); renderSched(); }
  });

  function schedCard(s) {
    const nx = nextEvent(s);

    }).join("");
    const price = priceTxt(s);
    return `<article class="card">
      <div class="row1">
        <div class="name">${esc(s.name)}</div>

        ${s.units ? `<span>${s.units.toLocaleString()}세대</span>` : ""}
        ${price ? `<span>분양가 <b>${price}</b></span>` : ""}

        ${s.price_cap === "Y" ? `<span>분양가상한제</span>` : ""}</div>

  function renderSched() {

      if (done.length) html += `<div class="group-h"><span>최근 종료</span><span>${done.length}건</span></div><div class="list">${[...done].sort(cmp).map(schedCard).join("")}</div>`;

      const key = n <= 0 ? "오늘 · 진행 중" : n <= 7 ? "이번 주 (7일 이내)" : n <= 14 ? "다음 주" : n <= 31 ? "이번 달" : "그 이후";

    });
    let html = "";
    groups.forEach((list, key) => { html += `<div class="group-h"><span>${key}</span><span>${list.length}건</span></div><div class="list">${list.map(schedCard).join("")}</div>`; });
    if (done.length) html += `<div class="group-h"><span>최근 종료 (계약·발표 확인용)</span><span>${done.length}건</span></div><div class="list">${done.map(schedCard).join("")}</div>`;
    $("#sched-list").innerHTML = html || `<p class="empty">조건에 맞는 공고가 없습니다. 위 필터를 바꿔 보세요.</p>`;

  }

  // ---------------------------------------------------------------- 정비사업
  const MS = [["d_zone", "구역지정"], ["d_comm", "추진위"], ["d_union", "조합설립"], ["d_review", "건축심의"],
              ["d_impl", "사업시행인가"], ["d_mgmt", "관리처분인가"], ["d_move_s", "이주"], ["d_start", "착공"]];
  const STAGE_MS = { "구역지정": ["d_zone2", "d_zone"], "추진위": ["d_comm"], "조합설립": ["d_union"], "건축심의": ["d_review"],
                     "사업시행": ["d_impl2", "d_impl"], "관리처분": ["d_mgmt2", "d_mgmt"], "착공": ["d_start"] };
  const stageDate = (p) => { const m = p.milestones || {}; for (const k of (STAGE_MS[p.stage] || [])) if (m[k]) return m[k]; return null; };
  const latestDate = (p) => Object.values(p.milestones || {}).sort().pop() || p.updated || "";

  function renderPipeFilters() {
    const stages = D.stages;
    if (!st.minStage) st.minStage = D.default_min_stage || stages[0];
    const minIdx = stages.indexOf(st.minStage);
    const counts = stages.map((s) => D.pipeline.filter((p) => p.stage === s && passBase(p)).length);
    const lad = $("#ladder"); lad.innerHTML = "";
    stages.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = i >= minIdx ? "on" : "";
      b.title = `${s} 이상 보기`;
      b.innerHTML = `<b>${counts[i]}</b><span>${s}</span>`;
      b.addEventListener("click", () => { st.minStage = s; st.limit = 60; saveSt(); render(); });
      lad.append(b);
    });
    const regs = [...new Set(D.pipeline.map((p) => p.region).filter(Boolean))];
    if (!st.pRegions) st.pRegions = regs;
    const rb = $("#f-pipe-region"); rb.innerHTML = "";
    regs.forEach((r) => rb.append(chip(r, st.pRegions.includes(r), () => {
      st.pRegions = st.pRegions.includes(r) ? st.pRegions.filter((x) => x !== r) : [...st.pRegions, r]; saveSt(); render();
    })));
    const types = [...new Set(D.pipeline.map((p) => p.type).filter(Boolean))];
    if (!st.pTypes) st.pTypes = types;
    const tb = $("#f-pipe-type"); tb.innerHTML = "";
    types.forEach((t) => tb.append(chip(t, st.pTypes.includes(t), () => {

  }
  function passBase(p) {
    if (st.coreOnly && p.core === false) return false;

    if (st.pTypes && p.type && !st.pTypes.includes(p.type)) return false;
    if (st.watchOnly && !(p.watched || favs.has(p.id))) return false;
    if (st.q) {
      const hay = [p.name, p.sigungu, p.address, p.road_address, p.memo, p.builder].join(" ").toLowerCase();
      if (!hay.includes(st.q.toLowerCase())) return false;
    }
    return true;
  }
  function pipeCard(p) {

      const g = L.layerGroup();
      const col = cssVar(v);
      (P[k] || []).forEach((x) => {
        const pr = x.geo === "dong" || x.geo === "area" ? x.geo : "exact"; cnt[pr]++;
        const fo = (k === "zones" ? 0.35 : 0.8) * (pr === "exact" ? 1 : pr === "dong" ? 0.55 : 0.3);
        const m = L.circleMarker([x.lat, x.lng], { radius: k === "zones" ? 4 : 8, color: col, weight: pr === "exact" ? 2 : 1.5,
                                        dashArray: pr === "exact" ? null : (pr === "dong" ? "4 2" : "2 3"),
                                        fillColor: col, fillOpacity: fo }).bindPopup(popupHtml(k, x), { maxWidth: 280 });
        m.addTo(g); MAP_MARKERS[x.id] = m;
      });
      MAP_LAYERS[k] = g;
      if (on[k]) g.addTo(MAP);
    });
    const total = cnt.exact + cnt.dong + cnt.area;
    const gs = D.geo_status || {}, kk = gs.kakao || "none";
    const kakaoTxt = kk.startsWith("ok") ? `카카오 키 정상 (${kk.slice(3)})` : kk.startsWith("rejected") ? `⚠ 카카오 키 거절됨 (${kk.slice(10)}) — REST API 키·[카카오맵] 사용 설정 확인`
      : kk === "unused" ? "카카오 키 설정됨 (이번 갱신엔 새로 찾을 곳 없음)" : "카카오 키 없음";
    $("#map-note").textContent = `[${kakaoTxt}] 표시 ${total}곳 — 단지·번지 ${cnt.exact} · 동 단위 ${cnt.dong} · 구 중심(대략) ${cnt.area}.`
      + (cnt.dong + cnt.area ? " 무료 지도 검색은 번지까지 못 찾는 곳이 많습니다. .env 에 KAKAO_REST_KEY(무료)를 넣으면 거의 전부 번지 위치로 바뀝니다." : "")
      + (cnt.area ? " 구 중심 항목은 다음 갱신 때 이어서 찾습니다." : "");
    setTimeout(() => MAP.invalidateSize(), 50);
    if (MAP_FOCUS && MAP_MARKERS[MAP_FOCUS]) {
      const m = MAP_MARKERS[MAP_FOCUS];
      Object.entries(MAP_LAYERS).forEach(([k, g]) => { if (g.hasLayer(m) && !MAP.hasLayer(g)) g.addTo(MAP); });
      MAP.setView(m.getLatLng(), 14); m.openPopup(); MAP_FOCUS = null;
    }
  }
  document.addEventListener("click", (e) => { const a = e.target.closest("[data-map]"); if (a) { MAP_FOCUS = a.dataset.map; if (location.hash === "#map") renderMap(); } });

  // ---------------------------------------------------------------- 내 자격
  const FIELDS = [
    ["기본", [["birth", "생년월일", "date"], ["marital", "혼인 상태", "select", [["single", "미혼"], ["engaged", "결혼 예정(예비신혼)"], ["married", "기혼"]]],
      ["marriage_date", "혼인신고일(예정이면 빈칸 가능)", "date"], ["household_head", "세대주", "bool"], ["household_size", "세대원 수(본인 포함)", "num"], ["with_parents", "부모님과 같은 등본", "bool"]]],
    ["주택·당첨 이력", [["homes_owned", "보유 주택 수 (아파트·빌라 등)", "num"], ["officetel", "보유 오피스텔 수 — 청약에선 주택 아님", "num"], ["ever_owned_home", "과거에 주택을 가진 적 있음", "bool"],
      ["won_5y", "최근 5년 안에 세대원 당첨", "bool"], ["special_won", "특별공급 당첨 이력", "bool"]]],
    ["거주", [["sido", "시·도", "select", [["서울", "서울"], ["경기", "경기"], ["인천", "인천"], ["기타", "그 외"]]], ["sigungu", "시·군·구", "text"], ["residence_since", "이 시·도에 계속 산 시작일(전입일)", "date"]]],
    ["청약통장", [["acct_years", "가입 기간(년)", "num"], ["acct_payments", "납입 회차", "num"], ["acct_balance", "잔액·예치금 (만원)", "num"]]],
    ["소득 (만원/년)", [["income_self", "본인 전년도 총급여", "num"], ["income_includes_bonus", "위 금액에 성과급 포함", "bool"], ["tax_years", "소득세 낸 햇수", "num"], ["spouse_income", "배우자(예정) 연소득 (없으면 0)", "num"]]],
    ["자산 (만원)", [["realestate", "부동산 가액 (오피스텔 포함)", "num"], ["lease_deposit", "전·월세 보증금", "num"], ["financial_assets", "금융자산 (예금·주식)", "num"], ["car", "자동차 가액", "num"], ["debts", "부채 (전세대출 등)", "num"], ["parent_assets", "부모 자산 (청년특공용)", "num"]]],
    ["가족", [["children", "미성년 자녀 수", "num"], ["newborn", "2세 미만 자녀·임신", "num"], ["parent65_years", "65세 이상 부모 부양 햇수", "num"]]],
    ["배우자(예정)", [["spouse_homeless", "배우자 무주택", "bool"], ["spouse_ever_owned", "배우자 과거 주택 소유", "bool"], ["spouse_acct_years", "배우자 통장 가입 기간(년)", "num"], ["spouse_realestate", "배우자 부동산 가액 (만원)", "num"]]],
  ];
  function fieldHtml([k, label, type, opts]) {
    const v = PROF[k];
    const unk = (v === null || v === undefined || v === "") && type !== "bool" && type !== "text" && k !== "marriage_date";
    if (type === "bool") return `<label class="fld chk"><input type="checkbox" id="pf-${k}" data-k="${k}" ${v ? "checked" : ""}><span>${esc(label)}</span></label>`;
    if (type === "select") return `<label class="fld">${esc(label)}<select id="pf-${k}" data-k="${k}">${opts.map(([val, t]) => `<option value="${val}" ${v === val ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;
    return `<label class="fld ${unk ? "unk" : ""}">${esc(label)}${unk ? " · 모름" : ""}<input id="pf-${k}" data-k="${k}" type="${type === "num" ? "number" : type}" ${type === "num" ? 'inputmode="decimal" step="any"' : ""} value="${v == null ? "" : esc(v)}"></label>`;
  }
  function meResultsHtml() {
    const P = EP(); if (!P || !window.Elig) return "<p class='meta'>판정 기준을 불러오지 못했습니다.</p>";
    const E = window.Elig;
    const now = E.summary(PROF, P, TODAY);
    const md2 = PROF.marriage_date || (() => { const d = new Date(); d.setMonth(d.getMonth() + 9); return d.toISOString().slice(0, 10); })();
    const after = { ...PROF, marital: "married", marriage_date: md2 };
    const later = new Date(Date.parse(md2) + 30 * 864e5).toISOString().slice(0, 10);
    const aft = E.summary(after, P, later > TODAY ? later : TODAY);
    const all = [...now.public, ...now.private_seoul, ...now.private_gg, ...now.etc];
    const cnt = (x) => all.filter((r) => r.status === x).length;
    const sc = E.score(PROF, TODAY), sc2 = E.score(after, later > TODAY ? later : TODAY);
    const open = D.schedules.filter((s) => nextEvent(s) && st.regions.includes(s.region) && focusOk(s) && eligOk(s));
    let h = `<div class="panel"><div class="kpis">
      <div class="kpi ok"><b>${cnt("ok")}</b><span>지금 넣을 수 있는 유형</span></div>
      <div class="kpi mid"><b>${cnt("maybe")}</b><span>정보 더 필요(확인)</span></div>
      <div class="kpi later"><b>${cnt("later")}</b><span>결혼·출산 후 가능</span></div>
      <div class="kpi"><b>${sc.total ?? sc.min + "+"}<small style="font-size:.8rem">/84</small></b><span>내 가점 → 혼인 후 ${sc2.total ?? "?"}점</span></div>
      <div class="kpi"><b>${open.length}</b><span>지금 넣을 수 있는 공고 (확인 필요 포함)</span></div></div>
      <div class="meta">가점 내역: ${sc.items.map((i) => `${esc(i.label)} ${i.points ?? "?"}/${i.max} (${esc(i.detail)})`).join(" · ")}</div></div>`;
    const row = (r, r2) => `<tr><td>${esc(r.label)}${r.route ? `<div class="meta">${esc(r.route)}</div>` : ""}</td>
      <td><span class="agree ${ST_CLS[r.status]}">${ST_TXT[r.status]}</span></td>
      <td>${r2 ? `<span class="agree ${ST_CLS[r2.status]}">${ST_TXT[r2.status]}</span>${r2.route ? `<div class="meta">${esc(r2.route)}</div>` : ""}` : "-"}</td>
      <td class="why">${r.reasons.map(esc).join("<br>")}</td></tr>`;
    const grp = (title, a, b) => `<tr class="grp"><td colspan="4">${esc(title)}</td></tr>` + a.map((r, i) => row(r, b && b[i])).join("");
    h += `<h3 style="margin:16px 0 6px">청약 종류별 내 자격</h3><div class="tbl-wrap"><table class="ttree"><thead><tr><th>유형</th><th>지금</th><th>혼인신고 후</th><th>이유</th></tr></thead><tbody>
      ${grp("A. 국민주택 (LH·SH·GH 공공분양) — 서울 기준", now.public, aft.public)}
      ${grp("B. 민영주택 — 서울(투기과열) 기준", now.private_seoul, aft.private_seoul)}
      ${grp("B'. 민영주택 — 경기 비규제(화성·파주·시흥 등)", now.private_gg, aft.private_gg)}
      ${grp("C. 남은 물량", now.etc, aft.etc)}</tbody></table></div>
      <p class="meta">‘혼인신고 후’는 ${esc(md2)} 혼인신고, 배우자 정보는 아래 입력값으로 가정한 결과입니다.</p>`;
    const miss = E.missing(PROF);
    if (miss.length) h += `<h3 style="margin:16px 0 6px">더 알려주면 정확해지는 것</h3><ul class="news">${miss.map((m) => `<li><b>${esc(m.label)}</b> — <span class="meta">${esc(m.why)}</span></li>`).join("")}</ul>`;
    if (open.length) h += `<h3 style="margin:16px 0 6px">지금 넣을 수 있는 공고</h3><ul class="news">${open.map((s) => { const e = elig(s); const nx = nextEvent(s);
      return `<li><a href="#schedule">${esc(s.name)}</a> <span class="meta">${esc(nx.label)} ${md(nx.start)} · ${esc(e ? e.label : "")}</span></li>`; }).join("")}</ul>`;
    const srcs = (D.guide.elig_sources || []).map((x) => `<li>${x.verified ? `<span class="off">공식 확인</span>` : `<span class="unoff">금액 미확인</span>`} <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>${x.date ? ` <span class="meta">${esc(x.date)}</span>` : ""}</li>`).join("");
    h += `<details class="x"><summary>판정 기준과 출처 (확인일 ${esc(P.checked)})</summary><ul class="news">${srcs}</ul>
      <p class="meta">공식 원문으로 금액을 아직 확인하지 못한 기준(청년 특공 소득·자산, 공공 총자산, 민영 특공 추첨용 부동산 기준, 1~2인 가구 가산)은 판정이 '확인 필요'로 나올 수 있습니다. 해당 입주자모집공고문의 금액이 최종 기준입니다.</p>
      <p class="meta">오피스텔은 주택법상 준주택이라 청약 무주택 판정에서 주택 수에 넣지 않습니다. 다만 공공분양 자산 기준에는 부동산으로 들어갑니다. 소득은 전년도 총급여(성과급 포함) 기준입니다.</p></details>`;
    return h;
  }
  function renderMe() {
    const box = $("#me");
    if (!box.dataset.built) {
      box.innerHTML = `<div id="me-res" style="margin-top:12px"></div>
        <details class="x panel" id="pf-wrap" style="margin-top:12px"><summary>내 정보 보기·고치기</summary><div class="meta" id="pf-src"></div>
        <form class="form" id="pf" autocomplete="off">${FIELDS.map(([t, fs]) => `<fieldset><legend>${esc(t)}</legend>${fs.map(fieldHtml).join("")}</fieldset>`).join("")}</form>
        <div class="btns"><button type="button" class="btn" id="pf-save">이 기기에 저장</button>
          <button type="button" class="btn ghost" id="pf-save-pc" hidden>PC에도 저장</button>
          <button type="button" class="btn ghost" id="pf-reset">처음 값으로</button></div>
        <p class="meta">입력값은 이 기기 브라우저(와 선택하면 내 PC의 profile.local.json)에만 저장됩니다. 외부 서버로 보내지 않습니다.</p></details>`;
      box.dataset.built = "1";
      let t = null;
      $("#pf").addEventListener("input", (e) => {
        const el = e.target, k = el.dataset.k; if (!k) return;
        let v = el.type === "checkbox" ? el.checked : el.value;
        if (el.type === "number") v = v === "" ? null : +v;
        PROF[k] = v;
        el.closest(".fld") && el.closest(".fld").classList.toggle("unk", el.type === "number" && v == null);
        clearTimeout(t); t = setTimeout(() => { ELC = new Map(); $("#me-res").innerHTML = meResultsHtml(); }, 180);
      });
      $("#pf-save").addEventListener("click", () => { store.set("profile", PROF); PROF_SRC = "이 기기에 저장한 값"; $("#pf-src").textContent = "출처: " + PROF_SRC; toast("이 기기에 저장했습니다"); render(); });
      $("#pf-save-pc").addEventListener("click", async () => {
        try { const r = await fetch("api/profile", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(PROF) });
          toast(r.ok ? "PC의 profile.local.json 에 저장했습니다" : "PC 저장 실패 — 같은 와이파이에서만 가능합니다"); } catch (e) { toast("PC 저장 실패"); }
      });
      $("#pf-reset").addEventListener("click", () => { try { localStorage.removeItem("profile"); } catch (e) {}
        PROF = { ...BLANK, ...(SERVER_PROFILE || {}) }; PROF_SRC = SERVER_PROFILE ? "PC의 profile.local.json" : "빈 기본값"; box.dataset.built = ""; ELC = new Map(); render(); toast("처음 값으로 되돌렸습니다"); });
    }
    if (!PROF.birth) $("#pf-wrap").open = true;
    $("#pf-src").textContent = "출처: " + PROF_SRC + (PROF.marriage_note ? ` · 결혼 ${PROF.marriage_note}` : "");
    $("#pf-save-pc").hidden = !(SERVER && SERVER.profile_editable);
    $("#me-res").innerHTML = meResultsHtml();
  }
  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.append(t); setTimeout(() => t.remove(), 2600);
  }

  // ---------------------------------------------------------------- 최신 정보 가져오기 (로컬 서버일 때)
  let SERVER = null, POLL = null;
  function setBusy(b, label) {
    const r = $("#refresh"); r.setAttribute("aria-busy", b ? "true" : "false");
    r.textContent = b ? (label || "가져오는 중…") : "↻ 최신 정보";
  }
  async function checkServer(auto) {
    if (window.__DATA__) return;
    try { const r = await fetch("api/status", { cache: "no-store" }); if (!r.ok) throw 0; SERVER = await r.json(); }
    catch (e) { SERVER = null; $("#refresh").hidden = true; return; }
    $("#refresh").hidden = false;
    $("#pf-link").hidden = !SERVER.portfolio;
    if ($("#pf-save-pc")) $("#pf-save-pc").hidden = !SERVER.profile_editable;
    const ageMin = (Date.now() - Date.parse(D.generated_at)) / 6e4;
    if (SERVER.running) poll();
    else if (auto && ageMin > 60) refreshNow(false);
  }
  async function refreshNow(force) {
    setBusy(true);
    try { await fetch("api/refresh" + (force ? "?force=1" : ""), { method: "POST" }); } catch (e) {}
    poll();
  }
  function poll() {
    if (POLL) return;
    setBusy(true);
    const before = D.generated_at;
    POLL = setInterval(async () => {
      try {
        const s = await (await fetch("api/status", { cache: "no-store" })).json();
        if (s.running) return;
        clearInterval(POLL); POLL = null;
        const d = await (await fetch("data/data.json", { cache: "no-store" })).json();
        setBusy(false);
        if (d.generated_at !== before) {
          const fresh = (d.changes || []).filter((c) => c.at > before && c.kind !== "init").length;
          boot(d); toast(fresh ? `최신 정보 반영 · 새 소식 ${fresh}건` : "최신 정보 반영 · 바뀐 공고 없음");
        } else toast(s.last_run_ok === false ? "갱신 실패 — PC 창의 메시지를 확인하세요" : "이미 최신입니다");
      } catch (e) { clearInterval(POLL); POLL = null; setBusy(false); }
    }, 4000);
  }
  $("#refresh").addEventListener("click", () => refreshNow(true));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && D) checkServer(true); });

  // ---------------------------------------------------------------- 라우팅
  const VIEWS = ["ranking", "schedule", "zupzup", "upcoming", "map", "me", "pipeline", "changes", "guide", "terms"];
  function route() {
    const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "ranking";
    VIEWS.forEach((x) => { $("#v-" + x).hidden = x !== v; });
    document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
    const cur = document.querySelector(`nav a[data-view="${v}"]`);
    if (cur) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (v === "map" && D) renderMap();
  }
  window.addEventListener("hashchange", route);

  function render() {
    ELC = new Map();
    if (!st.regions) st.regions = [...D.regions];
    renderFocusBar();
    renderSched(); renderRanking(); renderUpcoming(); renderMe(); renderPipe(); renderChanges(); renderGuide(); renderTerms(); renderZup();
    if (!$("#v-map").hidden) renderMap(); else { const lb = $("#map-layers"); if (lb && !lb.childElementCount) renderMap(); }
  }

  function boot(data) {
    D = data;
    $("#stamp").textContent = `갱신 ${data.generated_at.slice(0, 16).replace("T", " ")} KST`;
    const notes = [];
    if (data.sample) notes.push("샘플 데이터로 보는 중입니다. 인증키를 넣고 첫 갱신이 돌면 실제 공고로 바뀝니다.");
    (data.warnings || []).forEach((w) => notes.push(w));
    $("#banner").innerHTML = notes.length ? `<div class="banner"><b>알림</b><ul>${notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";
    $("#q").value = ""; $("#sort").value = st.sort;
    route(); render();
  }

  async function start(data) { await loadProfile(); boot(data); checkServer(true); }
  if (window.__DATA__) start(window.__DATA__);
  else fetch("data/data.json", { cache: "no-store" }).then((r) => r.json()).then(start).catch((e) => {
    $("#stamp").textContent = "데이터를 불러오지 못했습니다";
    $("#banner").innerHTML = `<div class="banner">data/data.json 을 읽지 못했습니다(${esc(e.message)}). 먼저 <code>python -m tracker.run</code> 을 실행하세요.</div>`;
  });
})();
</script>
</body>
</html>
